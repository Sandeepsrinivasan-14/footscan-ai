services:
  footscan:
    build: .
    image: footscan-ai:latest
    ports:
      - "8000:8000"
    environment:
      FOOTSCAN_ENVIRONMENT: production
      FOOTSCAN_LOG_LEVEL: INFO
      FOOTSCAN_DEVICE: auto
      # FOOTSCAN_API_KEY: set-a-real-secret-here   # uncomment to require X-API-Key on /api/*
    volumes:
      - footscan_data:/app/data
    # Remove this block if running on a machine without an NVIDIA GPU + nvidia-container-toolkit;
    # the app falls back to CPU automatically via FOOTSCAN_DEVICE=auto.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3.11", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  footscan_data:
