services:
  footscan:
    build: .
    image: footscan-ai:latest
    ports:
      # Bound to loopback by default. Put a TLS-terminating reverse proxy in front for anything else.
      - "127.0.0.1:8000:8000"
    environment:
      FOOTSCAN_ENVIRONMENT: production
      FOOTSCAN_LOG_LEVEL: ${FOOTSCAN_LOG_LEVEL:-INFO}
      FOOTSCAN_DEVICE: ${FOOTSCAN_DEVICE:-auto}
      # Secrets come from the shell / an untracked .env file, never from this file.
      FOOTSCAN_API_KEY: ${FOOTSCAN_API_KEY:-}
      FOOTSCAN_CORS_ORIGINS: ${FOOTSCAN_CORS_ORIGINS:-}
      FOOTSCAN_RATE_LIMIT_PER_MINUTE: ${FOOTSCAN_RATE_LIMIT_PER_MINUTE:-30}
    volumes:
      - footscan_data:/app/data
    # Hardening: the app only writes to /app/data (volume) and temp files.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  footscan_data:
